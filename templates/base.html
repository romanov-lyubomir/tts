<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Turn text into speech in over 60 languages.">
    <meta name="theme-color" content="#212529">
    <title>{% block title %}TTS — Text to Speech{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: #f8f9fa;
            background-color: #212529;
        }
    </style>
    {% block css %}{% endblock %}
</head>

<body>
    {% block body %}{% endblock %}
</body>

</html>
